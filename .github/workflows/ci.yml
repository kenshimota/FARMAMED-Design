name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'contabo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: contabo
    concurrency:
      group: deploy-farmamed-frontend
      cancel-in-progress: false
    env:
      IMAGE: kenshimota/farmamed-frontend
      CONTAINER: farmamed-frontend
      NETWORK: strixcryptoapp
      HOST_PORT: "3003"
    steps:
      - uses: actions/checkout@v4

      - name: Build and push image
        run: |
          set -euo pipefail
          docker build \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:latest"

      - name: Deploy with create-container
        run: |
          set -euo pipefail
          export IMAGE CONTAINER
          export TAG="${{ github.ref_name }}"
          ~/create-container --restart unless-stopped \
            --network "$NETWORK" \
            -p "127.0.0.1:${HOST_PORT}:3000"

      - name: Healthcheck
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${HOST_PORT}/" >/dev/null; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 "$CONTAINER"
          exit 1
